spring:
  application:
    name: link-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/url_shortener}
    username: ${DB_USERNAME:url_shortener}
    password: ${DB_PASSWORD:url_shortener}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

app:
  short-link:
    base-url: ${SHORT_LINK_BASE_URL:https://sho.rt}

  stats-service:
    base-url: ${STATS_SERVICE_URL:http://localhost:8083}
    connect-timeout: 500ms
    read-timeout: 2s

logging:
  level:
    kz.amixady.urlshortener: DEBUG